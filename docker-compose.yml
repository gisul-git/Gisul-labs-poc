services:
  vm-backend:
    image: gisul/vm-manager-backend:latest
    container_name: vm-manager-backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # allowss reaching localhost:9000 SSH tunnel
    env_file:
      - .env
    networks:
      - vm-net

  vm-frontend:
    image: gisul/vm-manager-frontend:latest
    container_name: vm-manager-frontend
    restart: unless-stopped
    ports:
      - "4002:3000"
    depends_on:
      - vm-backend
    networks:
      - vm-net

networks:
  vm-net:
    driver: bridge
